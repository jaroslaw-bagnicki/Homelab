---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: UFW default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: UFW allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ security_ssh_port }}"
    proto: tcp
    from_ip: "{{ security_ufw_allow_ssh_from }}"

- name: UFW allow additional TCP ports
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ item }}"
    from_ip: "{{ security_ufw_allow_tcp_from }}"
  loop: "{{ security_ufw_allow_tcp_ports }}"
  when: security_ufw_allow_tcp_ports | length > 0

- name: UFW allow additional UDP ports
  community.general.ufw:
    rule: allow
    proto: udp
    port: "{{ item }}"
    from_ip: "{{ security_ufw_allow_udp_from }}"
  loop: "{{ security_ufw_allow_udp_ports }}"
  when: security_ufw_allow_udp_ports | length > 0

- name: UFW deny inbound TCP/80
  community.general.ufw:
    rule: deny
    direction: in
    proto: tcp
    to_port: "80"
    comment: "block direct HTTP — ingress via the edge appliance"
  when: security_ufw_deny_inbound_tcp_80 | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
  notify: Reload UFW

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Deploy fail2ban jail config
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Install the step CLI for SSH certificate operations
  when: security_ssh_certs_enabled | bool
  ansible.builtin.include_tasks: step_cli.yml

- name: Resolve ca.internal locally for certificate operations
  when: security_ssh_certs_enabled | bool
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+ca\.internal(\s|$)'
    line: "{{ hostvars['ca'].ansible_host | default('192.168.2.215') }} ca.internal"

- name: Ensure the user CA key file exists before sshd validation
  when: security_ssh_certs_enabled | bool
  ansible.builtin.file:
    path: "{{ security_ssh_user_ca_key }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Ensure the authorized principals directory exists
  when: security_ssh_certs_enabled | bool
  ansible.builtin.file:
    path: /etc/ssh/auth_principals
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy SSH authorized principals files
  when: security_ssh_certs_enabled | bool
  ansible.builtin.template:
    src: auth_principals.j2
    dest: "/etc/ssh/auth_principals/{{ item.key }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ security_ssh_authorized_principals | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart ssh

- name: Ensure the SSH host keys exist
  when: security_ssh_certs_enabled | bool
  ansible.builtin.command:
    cmd: ssh-keygen -A
  changed_when: false

- name: Check the CA root and host certificate files
  when: security_ssh_certs_enabled | bool
  ansible.builtin.stat:
    path: "{{ item }}"
  register: security_ssh_stat_files
  loop:
    - "{{ security_ssh_ca_root_file }}"
    - "{{ security_ssh_ca_root_fallback }}"
    - "{{ security_ssh_host_cert }}"
  loop_control:
    label: "{{ item }}"

- name: Resolve the CA root and current host certificate state
  when: security_ssh_certs_enabled | bool
  ansible.builtin.set_fact:
    security_ssh_resolved_root: >-
      {{ security_ssh_ca_root_file if security_ssh_stat_files.results[0].stat.exists
         else (security_ssh_ca_root_fallback if security_ssh_stat_files.results[1].stat.exists else '') }}
    security_ssh_host_cert_stat: "{{ security_ssh_stat_files.results[2] }}"

- name: Read the host public key for controller-side signing
  when:
    - security_ssh_certs_enabled | bool
    - security_ssh_host_cert_stat is defined
    - not security_ssh_host_cert_stat.stat.exists
    - security_ssh_resolved_root is defined
    - security_ssh_resolved_root | length > 0
  ansible.builtin.slurp:
    src: "{{ security_ssh_host_key }}.pub"
  register: security_ssh_host_pub

- name: Read the CA root for controller-side signing
  when:
    - security_ssh_certs_enabled | bool
    - security_ssh_host_cert_stat is defined
    - not security_ssh_host_cert_stat.stat.exists
    - security_ssh_resolved_root is defined
    - security_ssh_resolved_root | length > 0
  ansible.builtin.slurp:
    src: "{{ security_ssh_resolved_root }}"
  register: security_ssh_host_root

- name: Issue the host certificate from the control node
  when:
    - security_ssh_certs_enabled | bool
    - security_ssh_host_cert_stat is defined
    - not security_ssh_host_cert_stat.stat.exists
    - security_ssh_resolved_root is defined
    - security_ssh_resolved_root | length > 0
  block:
    - name: Create the controller-side certificate workspace
      ansible.builtin.file:
        path: "/tmp/homelab-ssh-issue-{{ inventory_hostname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write the host public key and CA root on the controller
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "0600"
      loop:
        - dest: "/tmp/homelab-ssh-issue-{{ inventory_hostname }}/{{ security_ssh_host_key | basename }}.pub"
          content: "{{ security_ssh_host_pub.content | b64decode }}"
        - dest: "/tmp/homelab-ssh-issue-{{ inventory_hostname }}/root_ca.crt"
          content: "{{ security_ssh_host_root.content | b64decode }}"
      loop_control:
        label: "{{ item.dest }}"
      delegate_to: localhost
      become: false

    - name: Check the controller step CLI
      ansible.builtin.command:
        cmd: step version
      register: security_ssh_controller_step
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false

    - name: Check the CA health from the controller
      when: security_ssh_controller_step.rc == 0
      ansible.builtin.command:
        cmd: "step ca health --ca-url {{ security_ssh_ca_url }} --root /tmp/homelab-ssh-issue-{{ inventory_hostname }}/root_ca.crt"
      register: security_ssh_ca_health
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false

    - name: Warn when the controller lacks the step CLI or ca.internal
      when:
        - security_ssh_controller_step.rc != 0 or (security_ssh_ca_health is defined and security_ssh_ca_health.rc != 0)
      ansible.builtin.debug:
        msg: >-
          Host certificate issuance skipped: the control node needs the step CLI and
          a working ca.internal resolution. Install step and re-run this playbook.
      changed_when: false

    - name: Fetch the host provisioner password from Key Vault
      when:
        - security_ssh_controller_step.rc == 0
        - security_ssh_ca_health is defined
        - security_ssh_ca_health.rc == 0
        - security_ssh_host_provisioner_password | length == 0
      block:
        - name: Look up the host provisioner password
          vars:
            security_ssh_vault_url: "https://{{ ca_trust_keyvault_name | default('homelab-bysxdb-kv') }}.vault.azure.net"
            security_ssh_azure_client_id: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_ID') }}"
            security_ssh_azure_secret: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET') }}"
            security_ssh_azure_tenant_id: "{{ lookup('ansible.builtin.env', 'AZURE_TENANT_ID') }}"
          ansible.builtin.set_fact:
            security_ssh_host_provisioner_password: >-
              {{ lookup('azure.azcollection.azure_keyvault_secret',
              security_ssh_host_provisioner_secret, vault_url=security_ssh_vault_url,
              client_id=security_ssh_azure_client_id, secret=security_ssh_azure_secret,
              tenant=security_ssh_azure_tenant_id) }}
          delegate_to: localhost
          become: false
          no_log: true
      rescue:
        - name: Warn that host certificate issuance is waiting for the SSH CA secret
          ansible.builtin.debug:
            msg: >-
              Key Vault secret '{{ security_ssh_host_provisioner_secret }}' is not available;
              skipping host certificate issuance. Run the SSH CA workload, publish the secret
              and re-run this playbook.
          changed_when: false

    - name: Write the host provisioner password on the controller
      when:
        - security_ssh_controller_step.rc == 0
        - security_ssh_ca_health is defined
        - security_ssh_ca_health.rc == 0
        - security_ssh_host_provisioner_password | length > 0
      ansible.builtin.copy:
        content: "{{ security_ssh_host_provisioner_password }}"
        dest: /tmp/homelab-ssh-issue-{{ inventory_hostname }}/provisioner-password
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Sign the host public key on the controller
      when:
        - security_ssh_controller_step.rc == 0
        - security_ssh_ca_health is defined
        - security_ssh_ca_health.rc == 0
        - security_ssh_host_provisioner_password | length > 0
      ansible.builtin.command:
        argv:
          - step
          - ssh
          - certificate
          - --host
          - --sign
          - --force
          - --principal
          - "{{ inventory_hostname }}"
          - --principal
          - "{{ inventory_hostname }}.internal"
          - --principal
          - "{{ ansible_host }}"
          - --provisioner
          - "{{ security_ssh_host_provisioner }}"
          - --provisioner-password-file
          - /tmp/homelab-ssh-issue-{{ inventory_hostname }}/provisioner-password
          - --ca-url
          - "{{ security_ssh_ca_url }}"
          - --root
          - /tmp/homelab-ssh-issue-{{ inventory_hostname }}/root_ca.crt
          - "{{ inventory_hostname }}"
          - "/tmp/homelab-ssh-issue-{{ inventory_hostname }}/{{ security_ssh_host_key | basename }}.pub"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Read the signed host certificate on the controller
      when:
        - security_ssh_controller_step.rc == 0
        - security_ssh_ca_health is defined
        - security_ssh_ca_health.rc == 0
        - security_ssh_host_provisioner_password | length > 0
      ansible.builtin.slurp:
        src: "/tmp/homelab-ssh-issue-{{ inventory_hostname }}/{{ security_ssh_host_key | basename }}-cert.pub"
      register: security_ssh_signed_cert
      delegate_to: localhost
      become: false

    - name: Install the signed host certificate
      when:
        - security_ssh_signed_cert is defined
        - security_ssh_signed_cert.content is defined
      ansible.builtin.copy:
        content: "{{ security_ssh_signed_cert.content | b64decode }}"
        dest: "{{ security_ssh_host_cert }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh
  always:
    - name: Remove the controller-side certificate workspace
      ansible.builtin.file:
        path: "/tmp/homelab-ssh-issue-{{ inventory_hostname }}"
        state: absent
      delegate_to: localhost
      become: false

- name: Re-check the host certificate after issuance
  when: security_ssh_certs_enabled | bool
  ansible.builtin.stat:
    path: "{{ security_ssh_host_cert }}"
  register: security_ssh_host_cert_final

- name: Install the host certificate renewal script
  when: security_ssh_certs_enabled | bool
  ansible.builtin.template:
    src: homelab-ssh-host-cert-renew.j2
    dest: /usr/local/sbin/homelab-ssh-host-cert-renew
    owner: root
    group: root
    mode: "0755"

- name: Install the host certificate renewal units
  when: security_ssh_certs_enabled | bool
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - homelab-ssh-host-cert-renew.service
    - homelab-ssh-host-cert-renew.timer
    - homelab-ssh-host-cert-renew-alert.service
  notify: Reload systemd

- name: Enable the host certificate renewal timer
  when:
    - security_ssh_certs_enabled | bool
    - security_ssh_host_cert_final is defined and security_ssh_host_cert_final.stat.exists
  ansible.builtin.systemd:
    name: homelab-ssh-host-cert-renew.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Run the host certificate renewal check
  when:
    - security_ssh_certs_enabled | bool
    - security_ssh_host_cert_final is defined and security_ssh_host_cert_final.stat.exists
  ansible.builtin.command:
    cmd: /usr/local/sbin/homelab-ssh-host-cert-renew
  changed_when: false

- name: Harden SSH — key-only, LAN password for non-root accounts
  ansible.builtin.template:
    src: 99-homelab-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-homelab-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart ssh
