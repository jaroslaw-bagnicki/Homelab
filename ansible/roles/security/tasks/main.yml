---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: UFW default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: UFW allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ security_ssh_port }}"
    proto: tcp
    from_ip: "{{ security_ufw_allow_ssh_from }}"

- name: UFW deny inbound TCP/80
  community.general.ufw:
    rule: deny
    direction: in
    proto: tcp
    to_port: "80"
    comment: "block direct HTTP — ingress via the edge appliance"
  when: security_ufw_deny_inbound_tcp_80 | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
  notify: Reload UFW

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Deploy fail2ban jail config
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Harden SSH — key-only, LAN password for breakglass
  ansible.builtin.copy:
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      Match Address 192.168.2.0/24
          PasswordAuthentication yes
      Match all
    dest: /etc/ssh/sshd_config.d/99-homelab-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart ssh
