---
nut_client_ups_name: ups
nut_client_server: 192.168.2.201
nut_client_keyvault_name: homelab-bysxdb-kv
nut_client_role: secondary
# `/etc/nut/nut.conf` MODE. The primary is always co-located with the host-native NUT server
# (ADR 39), so it runs `standalone`; the secondaries run `netclient`. Both this role and
# `nut_server` template that one file — keying the value to the role keeps them in agreement.
nut_client_nut_mode: "{{ 'standalone' if nut_client_role == 'primary' else 'netclient' }}"
nut_client_account: upsmon-fleet
nut_client_password_secret: nut-upsmon-secondary-password
nut_client_hostsync: 15
nut_client_finaldelay: 0
# Seconds of `upsd` unavailability tolerated before `upsmon` decides the UPS is dead and the node
# fails safe. 15 s (the NUT default) proved too tight once the server shared a host with Proxmox:
# an `upsd` restart or a `pve` reboot would stop the whole fleet on healthy mains. Raised 2026-10-11.
nut_client_deadtime: 60
