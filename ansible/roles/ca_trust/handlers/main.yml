---
# One handler, because `notify` matches by name and cannot choose between two. The command
# differs per family: Debian rebuilds from /usr/local/share/ca-certificates, the RHEL family
# extracts from /etc/pki/ca-trust/source/anchors.
- name: Update the system CA certificate store
  ansible.builtin.command:
    cmd: >-
      {{ 'update-ca-trust extract' if ansible_facts['os_family'] == 'RedHat'
         else 'update-ca-certificates' }}
  changed_when: true
