---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Install logrotate
  ansible.builtin.apt:
    name: logrotate
    state: present

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure journald volatile storage (eMMC longevity)
  ansible.builtin.copy:
    content: |
      [Journal]
      Storage=volatile
    dest: /etc/systemd/journald.conf.d/90-edge-volatile.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald
