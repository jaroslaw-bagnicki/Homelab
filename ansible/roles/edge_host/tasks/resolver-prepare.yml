---
- name: Gather service facts before starting Technitium
  ansible.builtin.service_facts:

- name: Stop systemd-resolved so Technitium can bind port 53
  when: "'systemd-resolved.service' in ansible_facts.services"
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: false
    state: stopped
  register: edge_host_resolved_stop

- name: Read the resolv.conf metadata before starting Technitium
  ansible.builtin.stat:
    path: /etc/resolv.conf
    follow: false
  register: edge_host_resolv_conf_prepare

- name: Remove a systemd-resolved resolv.conf symlink before starting Technitium
  when: edge_host_resolv_conf_prepare.stat.islnk | default(false)
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Decide whether a temporary resolver is needed
  ansible.builtin.set_fact:
    edge_host_resolver_bootstrap: >-
      {{ edge_host_resolved_stop.changed | default(false) or
      (edge_host_resolv_conf_prepare.stat.islnk | default(false)) }}

- name: Keep a working resolver while Technitium starts
  when: edge_host_resolver_bootstrap | bool
  ansible.builtin.copy:
    content: |
      # Temporary resolver while Technitium starts; replaced by the local resolver below.
      {% for nameserver in edge_host_bootstrap_nameservers %}
      nameserver {{ nameserver }}
      {% endfor %}
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
