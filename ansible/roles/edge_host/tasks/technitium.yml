---
- name: Install Technitium prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - dnsutils
      - libicu76
      - libssl3t64
      - tar
      - zlib1g
    state: present
    update_cache: true

- name: Ensure the Technitium group exists
  ansible.builtin.group:
    name: "{{ edge_host_technitium_group }}"
    system: true

- name: Ensure the Technitium system user exists
  ansible.builtin.user:
    name: "{{ edge_host_technitium_user }}"
    group: "{{ edge_host_technitium_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Ensure the Technitium directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(edge_host_technitium_user) }}"
    group: "{{ item.group | default(edge_host_technitium_group) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ edge_host_technitium_install_dir }}" }
    - { path: "{{ edge_host_technitium_config_dir }}" }
    - { path: "{{ edge_host_technitium_log_dir }}" }
    - { path: "{{ edge_host_technitium_cache_dir }}", owner: root, group: root }

- name: Fetch the .NET installer
  ansible.builtin.get_url:
    url: "{{ edge_host_technitium_dotnet_install_url }}"
    dest: "{{ edge_host_technitium_cache_dir }}/dotnet-install.sh"
    mode: "0755"

- name: Read installed .NET runtimes
  ansible.builtin.command:
    cmd: dotnet --list-runtimes
  register: edge_host_technitium_dotnet_runtimes
  changed_when: false
  failed_when: false

- name: Install the ASP.NET Core runtime
  ansible.builtin.command:
    argv:
      - "{{ edge_host_technitium_cache_dir }}/dotnet-install.sh"
      - --channel
      - "{{ edge_host_technitium_dotnet_channel }}"
      - --runtime
      - aspnetcore
      - --install-dir
      - "{{ edge_host_technitium_dotnet_dir }}"
      - --no-path
  changed_when: true
  when: >-
    edge_host_technitium_upgrade | bool or
    edge_host_technitium_dotnet_runtime not in edge_host_technitium_dotnet_runtimes.stdout

- name: Link dotnet into PATH
  ansible.builtin.file:
    src: "{{ edge_host_technitium_dotnet_dir }}/dotnet"
    dest: /usr/bin/dotnet
    state: link
    force: true

- name: Check whether the Technitium app is installed
  ansible.builtin.stat:
    path: "{{ edge_host_technitium_install_dir }}/DnsServerApp.dll"
  register: edge_host_technitium_app

- name: Download the Technitium portable app
  ansible.builtin.get_url:
    url: "{{ edge_host_technitium_portable_url }}"
    dest: "{{ edge_host_technitium_cache_dir }}/DnsServerPortable.tar.gz"
    mode: "0644"
    force: "{{ edge_host_technitium_upgrade | bool }}"
  register: edge_host_technitium_download
  when: not edge_host_technitium_app.stat.exists or edge_host_technitium_upgrade | bool

- name: Unpack the Technitium portable app
  ansible.builtin.unarchive:
    src: "{{ edge_host_technitium_cache_dir }}/DnsServerPortable.tar.gz"
    dest: "{{ edge_host_technitium_install_dir }}"
    remote_src: true
  when: not edge_host_technitium_app.stat.exists or edge_host_technitium_download is changed

- name: Set Technitium app ownership
  ansible.builtin.file:
    path: "{{ edge_host_technitium_install_dir }}"
    state: directory
    recurse: true
    owner: "{{ edge_host_technitium_user }}"
    group: "{{ edge_host_technitium_group }}"

- name: Deploy the Technitium systemd unit
  ansible.builtin.template:
    src: dns.service.j2
    dest: "/etc/systemd/system/{{ edge_host_technitium_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Technitium DNS

- name: Prepare the resolver for Technitium
  ansible.builtin.import_tasks: resolver-prepare.yml

- name: Enable and start Technitium DNS
  ansible.builtin.systemd_service:
    name: "{{ edge_host_technitium_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the Technitium API
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/status"
    return_content: true
  register: edge_host_technitium_status
  until: edge_host_technitium_status.status | default(0) == 200
  retries: 30
  delay: 2
  changed_when: false

- name: Assert Azure controller credentials are set for Technitium
  when: edge_host_technitium_admin_password | length == 0
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'AZURE_CLIENT_ID', default='') | length > 0
      - lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET', default='') | length > 0
      - lookup('ansible.builtin.env', 'AZURE_TENANT_ID', default='') | length > 0
    fail_msg: >-
      AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and AZURE_TENANT_ID must be set on the
      Ansible controller for the Technitium admin-password Key Vault lookup.
  delegate_to: localhost

- name: Fetch the Technitium admin password from Key Vault
  when: edge_host_technitium_admin_password | length == 0
  vars:
    edge_host_technitium_vault_url: "https://{{ edge_host_technitium_keyvault_name }}.vault.azure.net"
    edge_host_technitium_azure_client_id: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_ID') }}"
    edge_host_technitium_azure_secret: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET') }}"
    edge_host_technitium_azure_tenant_id: "{{ lookup('ansible.builtin.env', 'AZURE_TENANT_ID') }}"
  ansible.builtin.set_fact:
    edge_host_technitium_admin_password: >-
      {{ lookup('azure.azcollection.azure_keyvault_secret',
      edge_host_technitium_admin_secret_name, vault_url=edge_host_technitium_vault_url,
      client_id=edge_host_technitium_azure_client_id, secret=edge_host_technitium_azure_secret,
      tenant=edge_host_technitium_azure_tenant_id) }}
  delegate_to: localhost
  no_log: true

- name: Log in to Technitium with the provisioned password
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ edge_host_technitium_admin_password }}"
      includeInfo: "true"
  register: edge_host_technitium_login
  failed_when: false
  changed_when: false
  no_log: true

- name: Log in with the factory Technitium password
  when: >-
    (edge_host_technitium_status.json | default({})).hasDefaultCredentials | default(false) and
    ((edge_host_technitium_login.json | default({})).status | default('')) != 'ok'
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: admin
      includeInfo: "true"
  register: edge_host_technitium_default_login
  failed_when: false
  changed_when: false
  no_log: true

- name: Assert the factory Technitium password works
  when: edge_host_technitium_default_login.json is defined
  ansible.builtin.assert:
    that:
      - (edge_host_technitium_default_login.json | default({})).status | default('') == 'ok'
    fail_msg: >-
      Technitium reports default credentials but the factory admin/admin login
      failed; refusing to change the password.

- name: Set the provisioned Technitium admin password
  when: edge_host_technitium_default_login.json is defined
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/user/changePassword"
    method: POST
    headers:
      Authorization: "Bearer {{ edge_host_technitium_default_login.json.token }}"
    body_format: form-urlencoded
    body:
      pass: admin
      newPass: "{{ edge_host_technitium_admin_password }}"
  changed_when: true
  no_log: true

- name: Log in to Technitium with the provisioned password again
  when: edge_host_technitium_default_login.json is defined
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ edge_host_technitium_admin_password }}"
      includeInfo: "true"
  register: edge_host_technitium_login
  failed_when: false
  changed_when: false
  no_log: true

- name: Assert the Technitium admin login succeeded
  ansible.builtin.assert:
    that:
      - (edge_host_technitium_login.json | default({})).status | default('') == 'ok'
    fail_msg: >-
      Technitium admin login failed. Check the technitium-admin-password Key Vault
      secret and the admin password on the appliance.

- name: Remember the Technitium session token
  ansible.builtin.set_fact:
    edge_host_technitium_token: "{{ edge_host_technitium_login.json.token }}"
  no_log: true

- name: Read the Technitium zones
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/zones/list?filterName={{ edge_host_technitium_zone }}"
    headers:
      Authorization: "Bearer {{ edge_host_technitium_token }}"
  register: edge_host_technitium_zones
  changed_when: false
  no_log: true

- name: Create the internal zone
  when: >-
    edge_host_technitium_zones.json.response.zones | default([])
    | selectattr('name', 'equalto', edge_host_technitium_zone) | list | length == 0
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/zones/create"
    method: POST
    headers:
      Authorization: "Bearer {{ edge_host_technitium_token }}"
    body_format: form-urlencoded
    body:
      zone: "{{ edge_host_technitium_zone }}"
      type: Primary
  changed_when: true
  no_log: true

- name: Apply Technitium settings
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/settings/set"
    method: POST
    headers:
      Authorization: "Bearer {{ edge_host_technitium_token }}"
    body_format: form-urlencoded
    body: "{{ edge_host_technitium_settings }}"
  changed_when: false
  no_log: true

- name: Read the internal zone records
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/zones/records/get?domain={{ edge_host_technitium_zone }}&zone={{ edge_host_technitium_zone }}&listZone=true"
    headers:
      Authorization: "Bearer {{ edge_host_technitium_token }}"
  register: edge_host_technitium_zone_records
  changed_when: false
  no_log: true

- name: Remember the existing A records
  ansible.builtin.set_fact:
    edge_host_technitium_a_records: >-
      {{ edge_host_technitium_zone_records.json.response.records | default([])
      | selectattr('type', 'equalto', 'A') | list }}

- name: Add the internal DNS records
  ansible.builtin.uri:
    url: "{{ edge_host_technitium_api_url }}/api/zones/records/add"
    method: POST
    headers:
      Authorization: "Bearer {{ edge_host_technitium_token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ item.name }}"
      zone: "{{ edge_host_technitium_zone }}"
      type: A
      ttl: "{{ edge_host_technitium_ttl }}"
      ipAddress: "{{ item.ip }}"
      overwrite: "true"
  loop: "{{ edge_host_technitium_records }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (edge_host_technitium_a_records | selectattr('name', 'equalto', item.name)
    | map(attribute='rData') | map(attribute='ipAddress')
    | select('equalto', item.ip) | list | length == 0) and
    (edge_host_technitium_a_records
    | selectattr('name', 'equalto', item.name | regex_replace('\.' ~ edge_host_technitium_zone ~ '$', ''))
    | map(attribute='rData') | map(attribute='ipAddress')
    | select('equalto', item.ip) | list | length == 0)
  changed_when: true
  no_log: true
