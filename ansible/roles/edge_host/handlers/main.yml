---
- name: Restart systemd-journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Restart Technitium DNS
  ansible.builtin.systemd_service:
    name: dns
    state: restarted
    daemon_reload: true

- name: Reload Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: reloaded

- name: Restart Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted
    daemon_reload: true
