---
# LAN name space and resolver (ADR 37/40). The resolver is Technitium itself,
# so the host resolves `.internal` locally and the search suffix is `internal`.
edge_host_dns_search: "internal"
edge_host_dns_nameservers:
  - 127.0.0.1
# Transient upstream resolver used only between stopping systemd-resolved and the
# Technitium API coming up, so a failed first run does not leave the box unreachable.
edge_host_bootstrap_nameservers:
  - 1.1.1.1
  - 8.8.8.8

# Technitium DNS (ADR 40) — native systemd, authoritative for `internal.`
# and the fleet resolver. The portable app needs the ASP.NET Core runtime.
edge_host_technitium_enabled: true
edge_host_technitium_portable_url: "https://download.technitium.com/dns/DnsServerPortable.tar.gz"
edge_host_technitium_portable_sha256: "d56e2822a3645baa4850a987a033b207ffc3759761d2ee6cccdd70b8047252ff"
edge_host_technitium_dotnet_install_url: "https://dot.net/v1/dotnet-install.sh"
edge_host_technitium_dotnet_install_sha256: "082f7685e156738a1b2e2ed8381a621870d4ce8e8c59278034556f05c186eb2e"
edge_host_technitium_dotnet_channel: "10.0"
edge_host_technitium_dotnet_runtime: "Microsoft.AspNetCore.App 10.0."
edge_host_technitium_dotnet_dir: /opt/dotnet
edge_host_technitium_install_dir: /opt/technitium/dns
edge_host_technitium_config_dir: /etc/dns
edge_host_technitium_log_dir: /var/log/technitium/dns
edge_host_technitium_cache_dir: /var/cache/technitium
edge_host_technitium_user: dns-server
edge_host_technitium_group: dns-server
edge_host_technitium_service: dns
edge_host_technitium_api_url: "http://127.0.0.1:5380"
edge_host_technitium_domain: edge.internal
edge_host_technitium_zone: internal
edge_host_technitium_ttl: 300
edge_host_technitium_forwarders:
  - "cloudflare-dns.com (1.1.1.1)"
  - "dns.quad9.net (9.9.9.9)"
edge_host_technitium_forwarder_protocol: Tls
edge_host_technitium_keyvault_name: homelab-bysxdb-kv
edge_host_technitium_admin_secret_name: technitium-admin-password
edge_host_technitium_admin_password: ""
# Re-download the portable app and refresh the runtime (opt-in, like netdata_upgrade).
edge_host_technitium_upgrade: false
edge_host_technitium_records:
  - { name: "edge.internal", ip: "192.168.2.240" }
  - { name: "pve.internal", ip: "192.168.2.201" }
  - { name: "lab.internal", ip: "192.168.2.200" }
  - { name: "nas.internal", ip: "192.168.2.202" }
  - { name: "ca.internal", ip: "192.168.2.215" }
  - { name: "vtstack.internal", ip: "192.168.2.214" }
  # The canary service for the private-CA proxy path (#143); the wildcard below
  # covers every future service on the edge proxy.
  - { name: "netdata.internal", ip: "192.168.2.240" }
  - { name: "*.internal", ip: "192.168.2.240" }
# Settings applied through the REST API. Keep this list to values that matter
# for the edge box: DoT upstreams, LAN-only recursion, and a write-light eMMC.
edge_host_technitium_settings:
  dnsServerDomain: "{{ edge_host_technitium_domain }}"
  dnsServerLocalEndPoints: "0.0.0.0:53"
  forwarders: "{{ edge_host_technitium_forwarders | join(',') }}"
  forwarderProtocol: "{{ edge_host_technitium_forwarder_protocol }}"
  concurrentForwarding: "true"
  recursion: AllowOnlyForPrivateNetworks
  logQueries: "false"
  loggingType: Console
  enableInMemoryStats: "true"
  saveCache: "false"
  dnssecValidation: "true"
  enableBlocking: "false"
  ipv6Mode: Disabled
  dnsServerEnableCheckForUpdate: "false"
  dnsAppsEnableAutomaticUpdate: "false"
  webServiceLocalAddresses: "127.0.0.1"
  webServiceHttpPort: "5380"
  webServiceEnableTls: "false"

# Caddy (ADR 40) — the single LAN routing layer and ACME client for step-ca.
edge_host_caddy_enabled: true
edge_host_caddyfile: /etc/caddy/Caddyfile
edge_host_caddy_ca_url: "https://ca.internal:9000/acme/acme/directory"
edge_host_caddy_keyvault_name: homelab-bysxdb-kv
edge_host_caddy_ca_root_secret_name: ca-root-cert
edge_host_caddy_ca_root_path: /etc/caddy/step-ca-root.pem
edge_host_caddy_ca_root: ""
edge_host_caddy_sites:
  - name: netdata.internal
    upstream: "https://192.168.2.201:19999"
    # Netdata still serves its own self-signed certificate; the client-facing
    # leg is the step-ca leaf. #143 removes this backend-self-signed hop.
    tls_skip_verify: true
  # The Technitium console is plaintext on loopback only; Caddy is the sole
  # LAN-facing listener and serves it over TLS (ADR 34).
  - name: technitium.internal
    upstream: "http://127.0.0.1:5380"
