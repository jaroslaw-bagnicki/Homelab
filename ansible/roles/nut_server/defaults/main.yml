---
# NUT server role — runs the NUT server (`nutdrv_qx` driver + `upsd`) and serves the UPS to the
# fleet, host-native on the `pve` node. Decision: ADR 39 (supersedes ADR 30's LXC placement).
# The local primary `upsmon` is configured by the `nut_client` role; this role owns the server, the
# USB udev rule and the `nut-monitor` -> `nut-server` ordering.
nut_server_ups_name: ups
nut_server_driver: nutdrv_qx
nut_server_vendorid: "0665"
nut_server_productid: "5161"
nut_server_desc: "Green Cell UPSLM600"
nut_server_listen_address: "{{ ansible_host }}"
nut_server_port: 3493
nut_server_group: nut
nut_server_udev_rules: /etc/udev/rules.d/85-nut-usb.rules
nut_server_monitor_dropin: /etc/systemd/system/nut-monitor.service.d/10-after-nut-server.conf
nut_server_keyvault_name: homelab-bysxdb-kv
nut_server_primary_account: upsmon-host
nut_server_primary_secret: nut-upsmon-primary-password
nut_server_fleet_account: upsmon-fleet
nut_server_fleet_secret: nut-upsmon-secondary-password
# Override to skip the Key Vault lookups (tests); normally left empty.
nut_server_primary_password: ""
nut_server_fleet_password: ""
