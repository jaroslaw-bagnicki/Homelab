---
- name: Reload udev rules
  ansible.builtin.command:
    cmd: udevadm control --reload
  changed_when: true

- name: Trigger USB udev
  ansible.builtin.command:
    cmd: udevadm trigger --subsystem-match=usb
  changed_when: true

- name: Restart nut-server
  ansible.builtin.systemd_service:
    name: nut-server
    state: restarted

- name: Reload nut-server
  ansible.builtin.systemd_service:
    name: nut-server
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
