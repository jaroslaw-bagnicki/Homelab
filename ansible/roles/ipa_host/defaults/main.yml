---
# FreeIPA VM base (AlmaLinux 9) — RPM-family counterpart to the Debian/Ubuntu
# common+security roles. The IPA guest is not a normal fleet node: its
# hostname is the FQDN from ADR 43 and its firewall is firewalld, not UFW.

ipa_host_fqdn: ipa.internal
ipa_host_short_name: ipa
ipa_host_ip: 192.168.2.250
ipa_host_lan_cidr: 192.168.2.0/24

# Fleet resolver (ADR 40, #174). The IPA VM is a host, not a container: it owns
# /etc/resolv.conf and writes the Technitium pin. An empty value disables the
# pin for a bootstrap before `edge` exists.
ipa_host_dns_server: "192.168.2.240"
ipa_host_dns_search: "internal"

# 389 is deliberately absent until M3 client enrolment; the IPA server itself
# uses LDAPI/HTTPS locally. Record the ADR 34 decision when 389 is opened.
ipa_host_firewall_ports:
  - { port: "22", proto: tcp }
  - { port: "88", proto: tcp }
  - { port: "88", proto: udp }
  - { port: "464", proto: tcp }
  - { port: "464", proto: udp }
  - { port: "443", proto: tcp }
  - { port: "636", proto: tcp }

ipa_host_timezone: Etc/UTC

# ── SSH certificate trust (ADR 41) ───────────────────────────────────────────
# `ipa_host` replaces `common` + `security` for this guest, so it owns the certificate-trust
# half too — without it the host accepts only the break-glass fleet key and every playbook
# after this one runs on a 1 h root-equivalent credential.
ipa_host_ssh_certs_enabled: true
# Written by the ca_trust role; this role only points sshd at it.
ipa_host_ssh_user_ca_key: /etc/ssh/ssh_user_ca_key.pub
ipa_host_ssh_principals_dir: /etc/ssh/auth_principals
# Principals each Unix account accepts. A certificate must carry one of these to log in as
# that account; the fleet key in `authorized_keys` is unaffected and stays the break-glass path.
ipa_host_ssh_authorized_principals:
  fleetadm:
    - automation
    - agent-ai
ipa_host_ssh_authorized_principals_options: "no-port-forwarding,no-agent-forwarding,no-X11-forwarding"
