---
- name: Validate inventory_hostname is in supported set
  ansible.builtin.assert:
    that:
      - inventory_hostname in ['lab', 'cloudlab']
    fail_msg: "inventory_hostname '{{ inventory_hostname }}' is not in the supported set {lab, cloudlab}. Update the assertion in tasks/main.yml."

- name: Ensure Docker service directory exists
  ansible.builtin.file:
    path: "{{ docker_dir }}"
    state: directory
    mode: "0755"

- name: Ensure declared Docker networks exist
  community.docker.docker_network:
    name: "{{ item.name }}"
    state: present
    driver: "{{ item.driver | default('bridge') }}"
  loop: "{{ docker_services_networks }}"

# Host UFW does not filter Docker DNAT traffic (runbook 02 §2, ADR 34), so a
# LAN-published origin port is restricted in the DOCKER-USER chain instead.
- name: Check DOCKER-USER allow rule for the origin Caddy port
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - DOCKER-USER
      - -p
      - tcp
      - --dport
      - "{{ docker_services_caddy_port }}"
      - -s
      - "{{ docker_services_caddy_allow_from }}"
      - -j
      - ACCEPT
  register: docker_services_allow_check
  failed_when: false
  changed_when: false
  when: docker_services_caddy_allow_from | length > 0

- name: Insert DOCKER-USER allow rule (configured source only) for the origin Caddy port
  ansible.builtin.command:
    argv:
      - iptables
      - -I
      - DOCKER-USER
      - "1"
      - -p
      - tcp
      - --dport
      - "{{ docker_services_caddy_port }}"
      - -s
      - "{{ docker_services_caddy_allow_from }}"
      - -j
      - ACCEPT
  register: docker_services_allow_insert
  changed_when: true
  when:
    - docker_services_caddy_allow_from | length > 0
    - docker_services_allow_check.rc | default(1) != 0

- name: Check DOCKER-USER drop rule for the origin Caddy port
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - DOCKER-USER
      - -p
      - tcp
      - --dport
      - "{{ docker_services_caddy_port }}"
      - "!"
      - -s
      - "{{ docker_services_caddy_allow_from }}"
      - -j
      - DROP
  register: docker_services_drop_check
  failed_when: false
  changed_when: false
  when: docker_services_caddy_allow_from | length > 0

- name: Insert DOCKER-USER drop rule (all other sources) for the origin Caddy port
  ansible.builtin.command:
    argv:
      - iptables
      - -I
      - DOCKER-USER
      - "1"
      - -p
      - tcp
      - --dport
      - "{{ docker_services_caddy_port }}"
      - "!"
      - -s
      - "{{ docker_services_caddy_allow_from }}"
      - -j
      - DROP
  register: docker_services_drop_insert
  changed_when: true
  when:
    - docker_services_caddy_allow_from | length > 0
    - docker_services_drop_check.rc | default(1) != 0

- name: Install iptables-persistent so DOCKER-USER rules survive a reboot
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: docker_services_caddy_allow_from | length > 0

- name: Persist current iptables rules
  ansible.builtin.command: netfilter-persistent save
  changed_when: true
  when:
    - docker_services_caddy_allow_from | length > 0
    - docker_services_allow_insert is changed or docker_services_drop_insert is changed

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Redeploy docker services

- name: Template Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ docker_dir }}/Caddyfile"
    mode: "0644"
  notify: Restart Caddy

- name: Deploy docker services
  community.docker.docker_compose_v2:
    project_src: "{{ docker_dir }}"
    state: present
    pull: always

- name: Set Portainer admin password from Key Vault
  vars:
    vault_url: "https://{{ arc_keyvault_name }}.vault.azure.net"
  ansible.builtin.set_fact:
    portainer_admin_password: "{{ lookup('azure.azcollection.azure_keyvault_secret', portainer_admin_password_secret_name, vault_url=vault_url) }}"
  delegate_to: localhost
  no_log: true

- name: Wait for Portainer to listen on port 9000
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 9000
    delay: 3
    timeout: 30
  changed_when: false

- name: Init Portainer admin user
  ansible.builtin.uri:
    url: http://127.0.0.1:9000/api/users/admin/init
    method: POST
    body_format: json
    body:
      Username: admin
      Password: "{{ portainer_admin_password }}"
    status_code:
      - 200
      - 409
  register: portainer_init
  changed_when: portainer_init.status == 200
  no_log: true
