---
- name: Assert the distribution is served by the Docker repository
  ansible.builtin.assert:
    that:
      - docker_host_apt_distro | length > 0
    fail_msg: >-
      docker_host supports Debian and Ubuntu only — got
      '{{ ansible_facts['distribution'] }}'.

- name: Remove distro Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Install dependencies for Docker repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_host_apt_base_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Remove legacy Docker repo file (apt_repository format)
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/download_docker_com_linux_{{ docker_host_apt_distro }}.list"
    state: absent

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    uris: ["{{ docker_host_apt_base_url }}"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
