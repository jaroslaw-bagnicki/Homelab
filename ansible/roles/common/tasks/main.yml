---
- name: Set hostname to inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Add hostname to /etc/hosts for sudo performance
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ inventory_hostname }}"
    regexp: "^127\\.0\\.1\\.1\\s+"
    state: present

- name: Set timezone to Etc/UTC
  community.general.timezone:
    name: Etc/UTC
  notify: Restart time sync

- name: Determine NTP daemon (systemd-timesyncd preferred; chrony fallback)
  ansible.builtin.stat:
    path: /lib/systemd/system/systemd-timesyncd.service
  register: common_timesyncd_unit

- name: Ensure NTP service is running
  ansible.builtin.service:
    name: "{{ 'systemd-timesyncd' if common_timesyncd_unit.stat.exists else 'chrony' }}"
    state: started
    enabled: true

- name: Install Avahi daemon
  ansible.builtin.apt:
    name: avahi-daemon
    state: present
    update_cache: true
  when: common_enable_avahi | bool

- name: Enable Avahi daemon
  ansible.builtin.service:
    name: avahi-daemon
    state: started
    enabled: true
  when: common_enable_avahi | bool

- name: Deploy Ansible fleet public key to fleetadm
  ansible.posix.authorized_key:
    user: fleetadm
    state: present
    exclusive: true
    key: "{{ lookup('file', role_path ~ '/files/ssh/fleetadm.pub') }}"
    key_options: "{{ common_ssh_fleet_key_options }}"
