---
# Technitium DNS Server (ADR 40) — authoritative for `internal.` and the fleet
# resolver. Tunables only; structural constants live in vars/main.yml.

technitium_enabled: true

# Distribution and runtime pins. Bump the checksum deliberately with every upgrade.
technitium_portable_url: "https://download.technitium.com/dns/DnsServerPortable.tar.gz"
technitium_portable_sha256: "d56e2822a3645baa4850a987a033b207ffc3759761d2ee6cccdd70b8047252ff"
technitium_dotnet_install_url: "https://dot.net/v1/dotnet-install.sh"
technitium_dotnet_install_sha256: "082f7685e156738a1b2e2ed8381a621870d4ce8e8c59278034556f05c186eb2e"
technitium_dotnet_channel: "10.0"
technitium_dotnet_runtime: "Microsoft.AspNetCore.App 10.0."
# Re-download the portable app and refresh the runtime (opt-in, like netdata_upgrade).
technitium_upgrade: false

# Zone, records and upstreams.
technitium_domain: edge.internal
technitium_zone: internal
technitium_ttl: 300
technitium_forwarders:
  - "cloudflare-dns.com (1.1.1.1)"
  - "dns.quad9.net (9.9.9.9)"
technitium_forwarder_protocol: Tls
technitium_records:
  - { name: "edge.internal", ip: "192.168.2.240" }
  - { name: "pve.internal", ip: "192.168.2.201" }
  - { name: "lab.internal", ip: "192.168.2.200" }
  - { name: "nas.internal", ip: "192.168.2.202" }
  - { name: "ca.internal", ip: "192.168.2.215" }
  - { name: "vtstack.internal", ip: "192.168.2.214" }
  - { name: "ipa.internal", ip: "192.168.2.216" }
  # Service names the wildcard cannot cover would go here (the CA must be explicit);
  # everything else under `.internal` resolves to the edge proxy.
  - { name: "netdata.internal", ip: "192.168.2.240" }
  - { name: "*.internal", ip: "192.168.2.240" }

# Reverse DNS for the guest block. FreeIPA clients need forward and reverse
# records; the installer is run with --no-host-dns, so this is verified with dig.
technitium_reverse_zones:
  - "2.168.192.in-addr.arpa"
technitium_ptr_records:
  - { name: "216.2.168.192.in-addr.arpa", zone: "2.168.192.in-addr.arpa", target: "ipa.internal" }

# Kerberos/LDAP discovery records for FreeIPA (ADR 43). `_ldap._tcp` points at
# 389; the port stays closed in the IPA firewall until M3 client enrolment.
technitium_srv_records:
  - { name: "_kerberos._tcp.internal", target: "ipa.internal", port: 88, priority: 0, weight: 100 }
  - { name: "_kerberos._udp.internal", target: "ipa.internal", port: 88, priority: 0, weight: 100 }
  - { name: "_kerberos-master._tcp.internal", target: "ipa.internal", port: 88, priority: 0, weight: 100 }
  - { name: "_kerberos-master._udp.internal", target: "ipa.internal", port: 88, priority: 0, weight: 100 }
  - { name: "_kpasswd._tcp.internal", target: "ipa.internal", port: 464, priority: 0, weight: 100 }
  - { name: "_kpasswd._udp.internal", target: "ipa.internal", port: 464, priority: 0, weight: 100 }
  - { name: "_ldap._tcp.internal", target: "ipa.internal", port: 389, priority: 0, weight: 100 }

# Settings applied through the REST API — DoT upstreams, LAN-only recursion and
# a write-light eMMC.
technitium_settings:
  dnsServerDomain: "{{ technitium_domain }}"
  dnsServerLocalEndPoints: "0.0.0.0:53"
  forwarders: "{{ technitium_forwarders | join(',') }}"
  forwarderProtocol: "{{ technitium_forwarder_protocol }}"
  concurrentForwarding: "true"
  recursion: AllowOnlyForPrivateNetworks
  logQueries: "false"
  loggingType: Console
  enableInMemoryStats: "true"
  saveCache: "false"
  dnssecValidation: "true"
  enableBlocking: "false"
  ipv6Mode: Disabled
  dnsServerEnableCheckForUpdate: "false"
  dnsAppsEnableAutomaticUpdate: "false"
  webServiceLocalAddresses: "127.0.0.1"
  webServiceHttpPort: "5380"
  webServiceEnableTls: "false"

# Admin credentials from Key Vault. Set `technitium_admin_password` to skip the
# lookup in tests.
technitium_keyvault_name: homelab-bysxdb-kv
technitium_admin_secret_name: technitium-admin-password
technitium_admin_password: ""

# Rewrite /etc/resolv.conf and /etc/network/interfaces so the node resolves
# through Technitium. Disable when the role is deployed as a secondary server.
technitium_manage_host_resolver: true
# Comment written into the managed resolv.conf (kept verbatim for idempotence).
technitium_resolv_conf_comment: "# Managed by Ansible — Technitium DNS on the edge node (ADR 40)."
