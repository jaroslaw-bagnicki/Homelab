---
- name: Install Technitium prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - dnsutils
      - libicu76
      - libssl3t64
      - tar
      - zlib1g
    state: present
    update_cache: true

- name: Ensure the Technitium group exists
  ansible.builtin.group:
    name: "{{ technitium_group }}"
    system: true

- name: Ensure the Technitium system user exists
  ansible.builtin.user:
    name: "{{ technitium_user }}"
    group: "{{ technitium_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Ensure the Technitium directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(technitium_user) }}"
    group: "{{ item.group | default(technitium_group) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ technitium_install_dir }}" }
    - { path: "{{ technitium_config_dir }}", mode: "0700" }
    - { path: "{{ technitium_log_dir }}" }
    - { path: "{{ technitium_cache_dir }}", owner: root, group: root }

- name: Read installed .NET runtimes
  ansible.builtin.command:
    cmd: dotnet --list-runtimes
  register: technitium_dotnet_runtimes
  changed_when: false
  failed_when: false

- name: Fetch the .NET installer
  when: >-
    technitium_upgrade | bool or
    technitium_dotnet_runtime not in technitium_dotnet_runtimes.stdout
  ansible.builtin.get_url:
    url: "{{ technitium_dotnet_install_url }}"
    dest: "{{ technitium_cache_dir }}/dotnet-install.sh"
    checksum: "sha256:{{ technitium_dotnet_install_sha256 }}"
    mode: "0755"

- name: Install the ASP.NET Core runtime
  ansible.builtin.command:
    argv:
      - "{{ technitium_cache_dir }}/dotnet-install.sh"
      - --channel
      - "{{ technitium_dotnet_channel }}"
      - --runtime
      - aspnetcore
      - --install-dir
      - "{{ technitium_dotnet_dir }}"
      - --no-path
  changed_when: true
  when: >-
    technitium_upgrade | bool or
    technitium_dotnet_runtime not in technitium_dotnet_runtimes.stdout

- name: Link dotnet into PATH
  ansible.builtin.file:
    src: "{{ technitium_dotnet_dir }}/dotnet"
    dest: /usr/bin/dotnet
    state: link
    force: true

- name: Check whether the Technitium app is installed
  ansible.builtin.stat:
    path: "{{ technitium_install_dir }}/DnsServerApp.dll"
  register: technitium_app

- name: Download the Technitium portable app
  ansible.builtin.get_url:
    url: "{{ technitium_portable_url }}"
    dest: "{{ technitium_cache_dir }}/DnsServerPortable.tar.gz"
    checksum: "sha256:{{ technitium_portable_sha256 }}"
    mode: "0644"
    force: "{{ technitium_upgrade | bool }}"
  register: technitium_download
  when: not technitium_app.stat.exists or technitium_upgrade | bool

- name: Unpack the Technitium portable app
  ansible.builtin.unarchive:
    src: "{{ technitium_cache_dir }}/DnsServerPortable.tar.gz"
    dest: "{{ technitium_install_dir }}"
    remote_src: true
  when: not technitium_app.stat.exists or technitium_download is changed

- name: Set Technitium app ownership
  ansible.builtin.file:
    path: "{{ technitium_install_dir }}"
    state: directory
    recurse: true
    owner: "{{ technitium_user }}"
    group: "{{ technitium_group }}"

- name: Deploy the Technitium systemd unit
  ansible.builtin.template:
    src: dns.service.j2
    dest: "/etc/systemd/system/{{ technitium_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Technitium DNS

- name: Prepare the resolver for Technitium
  when: technitium_manage_host_resolver | bool
  ansible.builtin.import_tasks: resolver-prepare.yml

- name: Enable and start Technitium DNS
  ansible.builtin.systemd_service:
    name: "{{ technitium_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the Technitium API
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/status"
    return_content: true
  register: technitium_status
  until: technitium_status.status | default(0) == 200
  retries: 30
  delay: 2
  changed_when: false

- name: Assert Azure controller credentials are set for Technitium
  when: technitium_admin_password | length == 0
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'AZURE_CLIENT_ID', default='') | length > 0
      - lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET', default='') | length > 0
      - lookup('ansible.builtin.env', 'AZURE_TENANT_ID', default='') | length > 0
    fail_msg: >-
      AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and AZURE_TENANT_ID must be set on the
      Ansible controller for the Technitium admin-password Key Vault lookup.
  delegate_to: localhost

- name: Fetch the Technitium admin password from Key Vault
  when: technitium_admin_password | length == 0
  vars:
    technitium_vault_url: "https://{{ technitium_keyvault_name }}.vault.azure.net"
    technitium_azure_client_id: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_ID') }}"
    technitium_azure_secret: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET') }}"
    technitium_azure_tenant_id: "{{ lookup('ansible.builtin.env', 'AZURE_TENANT_ID') }}"
  ansible.builtin.set_fact:
    technitium_admin_password: >-
      {{ lookup('azure.azcollection.azure_keyvault_secret',
      technitium_admin_secret_name, vault_url=technitium_vault_url,
      client_id=technitium_azure_client_id, secret=technitium_azure_secret,
      tenant=technitium_azure_tenant_id) }}
  delegate_to: localhost
  no_log: true

- name: Log in to Technitium with the provisioned password
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ technitium_admin_password }}"
      includeInfo: "true"
  register: technitium_login
  failed_when: false
  changed_when: false
  no_log: true

- name: Log in with the factory Technitium password
  when: >-
    (technitium_status.json | default({})).hasDefaultCredentials | default(false) and
    ((technitium_login.json | default({})).status | default('')) != 'ok'
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: admin
      includeInfo: "true"
  register: technitium_default_login
  failed_when: false
  changed_when: false
  no_log: true

- name: Assert the factory Technitium password works
  when: technitium_default_login.json is defined
  ansible.builtin.assert:
    that:
      - (technitium_default_login.json | default({})).status | default('') == 'ok'
    fail_msg: >-
      Technitium reports default credentials but the factory admin/admin login
      failed; refusing to change the password.

- name: Set the provisioned Technitium admin password
  when: technitium_default_login.json is defined
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/user/changePassword"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_default_login.json.token }}"
    body_format: form-urlencoded
    body:
      pass: admin
      newPass: "{{ technitium_admin_password }}"
  changed_when: true
  no_log: true

- name: Log in to Technitium with the provisioned password again
  # Unconditional on purpose: a task skipped by `when` still assigns its result to
  # `register`, which would replace the success above with a dict that has no `json`.
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ technitium_admin_password }}"
      includeInfo: "true"
  register: technitium_login
  failed_when: false
  changed_when: false
  no_log: true

- name: Assert the Technitium admin login succeeded
  ansible.builtin.assert:
    that:
      - (technitium_login.json | default({})).status | default('') == 'ok'
    fail_msg: >-
      Technitium admin login failed. Check the technitium-admin-password Key Vault
      secret and the admin password on the appliance.

- name: Remember the Technitium session token
  ansible.builtin.set_fact:
    technitium_token: "{{ technitium_login.json.token }}"
  no_log: true

- name: Read the Technitium zones
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/list?filterName={{ technitium_zone }}"
    headers:
      Authorization: "Bearer {{ technitium_token }}"
  register: technitium_zones
  changed_when: false
  no_log: true

- name: Create the internal zone
  when: >-
    technitium_zones.json.response.zones | default([])
    | selectattr('name', 'equalto', technitium_zone) | list | length == 0
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/create"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    body_format: form-urlencoded
    body:
      zone: "{{ technitium_zone }}"
      type: Primary
  changed_when: true
  no_log: true

- name: Apply Technitium settings
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/settings/set"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    body_format: form-urlencoded
    body: "{{ technitium_settings }}"
  changed_when: false
  no_log: true

- name: Read the internal zone records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/get?domain={{ technitium_zone }}&zone={{ technitium_zone }}&listZone=true"
    headers:
      Authorization: "Bearer {{ technitium_token }}"
  register: technitium_zone_records
  changed_when: false
  no_log: true

- name: Remember the existing A records
  ansible.builtin.set_fact:
    technitium_a_records: >-
      {{ technitium_zone_records.json.response.records | default([])
      | selectattr('type', 'equalto', 'A') | list }}

- name: Add the internal DNS records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/add"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ item.name }}"
      zone: "{{ technitium_zone }}"
      type: A
      ttl: "{{ technitium_ttl }}"
      ipAddress: "{{ item.ip }}"
      overwrite: "true"
  loop: "{{ technitium_records }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (technitium_a_records | selectattr('name', 'equalto', item.name)
    | map(attribute='rData') | map(attribute='ipAddress')
    | select('equalto', item.ip) | list | length == 0) and
    (technitium_a_records
    | selectattr('name', 'equalto', item.name | regex_replace('\.' ~ technitium_zone ~ '$', ''))
    | map(attribute='rData') | map(attribute='ipAddress')
    | select('equalto', item.ip) | list | length == 0)
  changed_when: true
  no_log: true

- name: Read all Technitium zones
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/list"
    headers:
      Authorization: "Bearer {{ technitium_token }}"
  register: technitium_all_zones
  changed_when: false
  no_log: true

- name: Create the reverse DNS zones
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/create"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    body_format: form-urlencoded
    body:
      zone: "{{ item }}"
      type: Primary
  loop: "{{ technitium_reverse_zones }}"
  when: >-
    technitium_all_zones.json.response.zones | default([])
    | selectattr('name', 'equalto', item) | list | length == 0
  changed_when: true
  no_log: true

- name: Read the reverse zone records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/get?domain={{ item }}&zone={{ item }}&listZone=true"
    headers:
      Authorization: "Bearer {{ technitium_token }}"
  loop: "{{ technitium_reverse_zones }}"
  register: technitium_reverse_records
  changed_when: false
  no_log: true

- name: Add the reverse DNS records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/add"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ item.name }}"
      zone: "{{ item.zone }}"
      type: PTR
      ttl: "{{ technitium_ttl }}"
      ptrName: "{{ item.target }}"
      overwrite: "true"
  loop: "{{ technitium_ptr_records }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (technitium_reverse_records.results
    | selectattr('item', 'equalto', item.zone)
    | map(attribute='json') | map(attribute='response') | map(attribute='records')
    | first | default([])
    | selectattr('type', 'equalto', 'PTR')
    | selectattr('name', 'equalto', item.name)
    | map(attribute='rData')
    | selectattr('ptrName', 'match', '^' ~ (item.target | regex_escape) ~ '\.?$')
    | list | length == 0)
  changed_when: true
  no_log: true

- name: Add the FreeIPA SRV records
  ansible.builtin.uri:
    url: "{{ technitium_api_url }}/api/zones/records/add"
    method: POST
    headers:
      Authorization: "Bearer {{ technitium_token }}"
    body_format: form-urlencoded
    body:
      domain: "{{ item.name }}"
      zone: "{{ technitium_zone }}"
      type: SRV
      ttl: "{{ technitium_ttl }}"
      priority: "{{ item.priority }}"
      weight: "{{ item.weight }}"
      port: "{{ item.port }}"
      target: "{{ item.target }}"
      overwrite: "true"
  loop: "{{ technitium_srv_records }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (technitium_zone_records.json.response.records | default([])
    | selectattr('type', 'equalto', 'SRV')
    | selectattr('name', 'equalto', item.name)
    | map(attribute='rData')
    | selectattr('target', 'equalto', item.target)
    | selectattr('port', 'equalto', item.port)
    | list | length == 0)
  changed_when: true
  no_log: true
