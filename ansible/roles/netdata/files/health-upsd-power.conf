# UPS power-state alarms — mains loss and low battery (ADR 27 / ADR 30).
#
# The stock upsd alarms watch battery charge, load and collection staleness only, so a
# mains loss raises nothing. These two read the `upsd.ups_status` dimensions and give
# local evaluation (Alerts view + API). Delivery is deferred — hence `to: sitemgr`,
# which is a no-op for an unclaimed, LAN-only Parent.

 template: upsd_ups_on_battery
       on: upsd.ups_status
    class: Errors
     type: Power Supply
component: UPS
   lookup: max -1m unaligned of on_battery
    units: status
    every: 10s
     warn: $this > 0
    delay: down 30s multiplier 1.5 max 5m
  summary: UPS ${label:ups_name} is on battery
     info: UPS ${label:ups_name} has lost mains power
       to: sitemgr

 template: upsd_ups_low_battery
       on: upsd.ups_status
    class: Errors
     type: Power Supply
component: UPS
   lookup: max -1m unaligned of low_battery
    units: status
    every: 10s
     crit: $this > 0
    delay: down 30s multiplier 1.5 max 5m
  summary: UPS ${label:ups_name} battery is low
     info: UPS ${label:ups_name} reached LB — the fleet is about to shut down
       to: sitemgr
