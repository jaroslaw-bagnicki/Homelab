---
# Shared Netdata role — parent + child modes (ADR 27). Parent vs child is data,
# not code: the same task list runs fleet-wide, parameterized per host.
netdata_role: child
# Parent "host:port" for streaming children; empty = standalone (no streaming).
netdata_stream_target: ""
netdata_storage: dbengine
# Per-tier retention, one entry per dbengine tier (0 = 1s, 1 = 1m, 2 = 1h). `time` is the
# history target, `size` the hard disk cap — combined limits, so whichever binds first wins
# and a long `time` only holds if `size` can carry it. Children keep this default; the parent
# overrides it with its own tiers.
netdata_retention_tiers:
  - { time: "7d", size: "256MiB" }    # tier 0 — 1s
  - { time: "7d", size: "256MiB" }    # tier 1 — 1m
  - { time: "7d", size: "256MiB" }    # tier 2 — 1h
netdata_bind: "127.0.0.1"
netdata_port: 19999
# Serve listeners over TLS. The parent sets this, plus a per-listener `bind to` spec
# (e.g. `192.168.2.201:19999=dashboard^SSL=force`) so the dashboard is HTTPS-only.
netdata_tls: false
netdata_tls_cert: /etc/netdata/ssl/cert.pem
netdata_tls_key: /etc/netdata/ssl/key.pem
netdata_tls_days: 3650
# Child only: append `:SSL` to the stream destination (required when the parent forces TLS).
netdata_stream_ssl: false
# Parent runs on a Proxmox host — grants the netdata user read access to /etc/pve.
netdata_proxmox_host: false
# Re-run the kickstart installer to update an existing agent. Opt-in: set true, run, set false.
netdata_upgrade: false
# Override to skip the Key Vault lookup (tests); normally left empty.
netdata_stream_api_key: ""
netdata_stream_api_key_secret_name: netdata-stream-api-key
netdata_keyvault_name: homelab-bysxdb-kv
netdata_kickstart_url: https://get.netdata.cloud/kickstart.sh
# Optional go.d `upsd` job — chart UPS telemetry (battery charge, load, voltages,
# on-battery state) from a NUT daemon. Empty = no job. The parent points it at the
# NUT server on the HA node (LXC 213); anonymous `upsc` needs no credentials or secret.
netdata_upsd_address: ""
netdata_upsd_name: nut
