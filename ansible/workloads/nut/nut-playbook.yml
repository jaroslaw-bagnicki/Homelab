---
# NUT client workload — self-contained recipe.
#
# Installs nut-client + upsmon across the fleet per issue #116 / ADR 30:
#   - play 1: ha  (Proxmox host) — the sole upsmon primary
#   - play 2: lab, edge          — upsmon secondaries
#
# Upsmon passwords are pulled from Azure Key Vault at run time; none is a
# role default or committed. The NUT server itself (LXC 213) is out of scope
# and built by runbook 29 §1–§3.
#
# Run standalone:
#   ansible-playbook ansible/workloads/nut/nut-playbook.yml
#
# See:
#   ansible/workloads/nut/README.md            ansible-side facts
#   docs/workloads.md                          general rules + index
#   docs/runbooks/30-deploy-nut-clients.md     operational steps
- name: Apply NUT client workload — HA node (upsmon primary)
  hosts: ha
  become: true
  vars:
    nut_client_role: primary
    nut_client_account: upsmon-host
    nut_client_password_secret: nut-upsmon-primary-password
    nut_client_hostsync: 30
    nut_client_finaldelay: 30
  roles:
    - role: nut_client

- name: Apply NUT client workload — fleet secondaries
  hosts: lab:edge
  become: true
  roles:
    - role: nut_client
