---
- name: Validate inventory_hostname is in supported set
  ansible.builtin.assert:
    that:
      - inventory_hostname in ['homelab', 'cloudlab']
    fail_msg: "inventory_hostname '{{ inventory_hostname }}' is not in the supported set {homelab, cloudlab}. Update the assertion in tasks/main.yml."

- name: Ensure zot directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ zot_dir }}"
    - "{{ zot_data_dir }}"

- name: Ensure passlib and bcrypt installed for htpasswd module
  ansible.builtin.apt:
    name:
      - python3-passlib
      - python3-bcrypt
    state: present

- name: Fetch zot registry password from Key Vault
  vars:
    vault_url: "https://{{ zot_keyvault_name }}.vault.azure.net"
    azure_client_id: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_ID') }}"
    azure_secret: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET') }}"
    azure_tenant_id: "{{ lookup('ansible.builtin.env', 'AZURE_TENANT_ID') }}"
  ansible.builtin.set_fact:
    zot_registry_password: >-
      {{ lookup('azure.azcollection.azure_keyvault_secret',
      zot_registry_password_secret_name, vault_url=vault_url, client_id=azure_client_id,
      secret=azure_secret, tenant=azure_tenant_id) }}
  delegate_to: localhost
  no_log: true

- name: Write htpasswd entry
  community.general.htpasswd:
    path: "{{ zot_dir }}/htpasswd"
    name: "{{ zot_registry_user }}"
    password: "{{ zot_registry_password }}"
    crypt_scheme: bcrypt
    mode: "0600"
  no_log: true
  notify: Restart zot

- name: Template zot config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ zot_dir }}/config.json"
    mode: "0644"
  notify: Restart zot

- name: Ensure homelab_net Docker network exists
  community.docker.docker_network:
    name: homelab_net
    state: present
    driver: bridge

- name: Template zot docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ zot_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy zot container
  community.docker.docker_compose_v2:
    project_src: "{{ zot_dir }}"
    state: present
    pull: always
