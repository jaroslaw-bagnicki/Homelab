---
# Fixed asset table for the checksum-verified upstream releases.
step_ca_releases:
  - repo: smallstep/cli
    archive: step_linux_amd64.tar.gz
    member: step_linux_amd64/step
    dest: /usr/local/bin/step
    tag: cli
  - repo: smallstep/certificates
    archive: step-ca_linux_amd64.tar.gz
    member: step-ca_linux_amd64/step-ca
    dest: /usr/local/bin/step-ca
    tag: ca
  - repo: smallstep/step-kms-plugin
    archive: step-kms-plugin_linux_amd64.tar.gz
    member: step-kms-plugin_linux_amd64/step-kms-plugin
    dest: /usr/local/bin/step-kms-plugin
    tag: kms
