---
- name: Assert Azure controller credentials are set for FreeIPA
  when: freeipa_ds_password | length == 0 or freeipa_admin_password | length == 0
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'AZURE_CLIENT_ID', default='') | length > 0
      - lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET', default='') | length > 0
      - lookup('ansible.builtin.env', 'AZURE_TENANT_ID', default='') | length > 0
    fail_msg: >-
      AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and AZURE_TENANT_ID must be set on the
      Ansible controller for the FreeIPA install-password Key Vault lookups.
  delegate_to: localhost

- name: Fetch the FreeIPA install passwords from Key Vault
  when: freeipa_ds_password | length == 0 or freeipa_admin_password | length == 0
  vars:
    freeipa_vault_url: "https://{{ freeipa_keyvault_name }}.vault.azure.net"
    freeipa_azure_client_id: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_ID') }}"
    freeipa_azure_secret: "{{ lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET') }}"
    freeipa_azure_tenant_id: "{{ lookup('ansible.builtin.env', 'AZURE_TENANT_ID') }}"
  ansible.builtin.set_fact:
    freeipa_ds_password: >-
      {{ lookup('azure.azcollection.azure_keyvault_secret',
      freeipa_ds_password_secret, vault_url=freeipa_vault_url,
      client_id=freeipa_azure_client_id, secret=freeipa_azure_secret,
      tenant=freeipa_azure_tenant_id) }}
    freeipa_admin_password: >-
      {{ lookup('azure.azcollection.azure_keyvault_secret',
      freeipa_admin_password_secret, vault_url=freeipa_vault_url,
      client_id=freeipa_azure_client_id, secret=freeipa_azure_secret,
      tenant=freeipa_azure_tenant_id) }}
  delegate_to: localhost
  no_log: true
