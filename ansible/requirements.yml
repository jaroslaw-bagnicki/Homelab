collections:
  - name: ansible.posix
    version: ">=1.5.0"
  - name: community.docker
    version: "3.7.0"
  - name: community.general
    version: ">=7.0.0"
  - name: azure.azcollection
    version: ">=1.19.0"
  # OPNsense router (`router`) — manages the FreeBSD appliance over its REST API.
  # Pinned exactly: the collection has NO multi-version support (one release per OPNsense
  # release), so an unbounded range would let a fresh install pull modules for a newer
  # OPNsense against the fixed 26.7 appliance. 26.1.11 is the collection's own
  # "stable/tested" release. Needs `httpx` on the controller.
  - name: oxlorg.opnsense
    version: "26.1.11"
