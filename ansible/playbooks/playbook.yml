---
- name: Configure cloudlab VPS
  hosts: cloudlab
  become: true
  # The Docker workload stack (docker_services, OpenCode, Zot) moved to `lab`
  # as-is — intermediate step before the lab Docker → k3s migration (#44, ADR 22,
  # runbook 47). cloudlab keeps the base roles + Docker daemon until decommission.
  roles:
    - common
    - security
    - ca_trust
    - azure_arc
    - docker_host
