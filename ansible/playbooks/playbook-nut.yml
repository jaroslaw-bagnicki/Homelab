---
# Configure LXC 213 `nut` — the NUT server guest on the `pve` node (ADR 30 / ADR 39).
#
# Everything inside the guest: common → security → nut_server → fluentbit, so the NUT server
# (`upsd` + `nutdrv_qx`) is configured and its journal (nut-server, nut-driver@ups, systemd) ships
# to VictoriaLogs. The LXC lifecycle (pct create), USB passthrough and the host udev rule stay a
# Proxmox-host runbook (runbook 29 §1–§2) — this playbook touches nothing on `pve`.
#
# Run from a LAN workstation with the fleet key loaded (fleet-connect skill):
#   ansible-playbook ansible/playbooks/playbook-nut.yml --diff
# See runbook 35 (enroll/validate Proxmox guests).
- name: Configure nut (NUT server guest on pve) base
  hosts: nut
  become: true
  roles:
    - common
    - security
    - nut_server
    - fluentbit
