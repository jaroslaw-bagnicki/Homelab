---
- name: Configure lab M910q base
  hosts: lab
  become: true
  pre_tasks:
    - name: Extend LVM root volume to full disk
      community.general.lvol:
        vg: ubuntu-vg
        lv: ubuntu-lv
        size: "+100%FREE"
        resizefs: true
      when: ansible_facts['lvm']['vgs'] is defined and 'ubuntu-vg' in ansible_facts['lvm']['vgs']
  roles:
    - common
    - ca_trust
    - security
    - docker_host
    # Intermediate migration step (#44, ADR 22): the cloudlab Docker stack runs
    # as-is on lab; the docker_host → k3s_host role swap is postponed (runbook 47).
    - docker_services
    - azure_arc
    - nut_client
    - netdata
    - fluentbit
