---
# One-shot diagnostic: delete the .216 PTR and SHOW the API response (no no_log).
- name: Delete with visible response
  hosts: edge
  become: true
  vars:
    technitium_vault_url: "https://homelab-bysxdb-kv.vault.azure.net"
    technitium_admin_secret_name: technitium-admin-password
    technitium_api_url: "http://127.0.0.1:5380"
  tasks:
    - name: Fetch the Technitium admin password
      ansible.builtin.set_fact:
        technitium_admin_password: >-
          {{ lookup('azure.azcollection.azure_keyvault_secret',
          technitium_admin_secret_name, vault_url=technitium_vault_url,
          client_id=lookup('ansible.builtin.env', 'AZURE_CLIENT_ID'),
          secret=lookup('ansible.builtin.env', 'AZURE_CLIENT_SECRET'),
          tenant=lookup('ansible.builtin.env', 'AZURE_TENANT_ID')) }}
      delegate_to: localhost
      no_log: true

    - name: Log in
      ansible.builtin.uri:
        url: "{{ technitium_api_url }}/api/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: admin
          pass: "{{ technitium_admin_password }}"
        return_content: true
      register: login
      changed_when: false
      no_log: true

    - name: Read the reverse zone
      ansible.builtin.uri:
        url: "{{ technitium_api_url }}/api/zones/records/get?domain=2.168.192.in-addr.arpa&zone=2.168.192.in-addr.arpa&listZone=true"
        headers:
          Authorization: "Bearer {{ login.json.token }}"
        return_content: true
      register: rev
      changed_when: false
      no_log: true

    - name: Full record objects for .216
      ansible.builtin.debug:
        msg: >-
          {{ rev.json.response.records
             | selectattr('name', 'equalto', '216.2.168.192.in-addr.arpa')
             | list }}

    - name: Delete and SHOW the response
      ansible.builtin.uri:
        url: "{{ technitium_api_url }}/api/zones/records/delete"
        method: POST
        body_format: form-urlencoded
        body:
          domain: "216.2.168.192.in-addr.arpa"
          zone: "2.168.192.in-addr.arpa"
          type: PTR
          ptrName: >-
            {{ (rev.json.response.records
                | selectattr('name', 'equalto', '216.2.168.192.in-addr.arpa')
                | map(attribute='rData.ptrName') | list | first) }}
        headers:
          Authorization: "Bearer {{ login.json.token }}"
        return_content: true
        status_code: [200, 400, 500]
      register: del
      changed_when: false

    - name: Delete response
      ansible.builtin.debug:
        msg: "status={{ del.status }} body={{ del.json }}"
