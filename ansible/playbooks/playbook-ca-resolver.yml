---
# Later-phase resolver migration for the private CA guest. This is deliberately
# separate from playbook-ca.yml so the base CA can still be bootstrapped before
# the Technitium stack on `edge` exists (runbook 35).
- name: Point the CA guest at the edge resolver
  hosts: ca
  become: true
  tasks:
    - name: Install dig for resolver verification
      ansible.builtin.apt:
        name: dnsutils
        state: present
        update_cache: true

    - name: Verify the edge resolver knows service names
      ansible.builtin.command:
        cmd: "dig +short @{{ ca_dns_nameserver }} netdata.internal"
      register: ca_resolver_check
      changed_when: false
      retries: 5
      delay: 2
      until: ca_resolver_check.stdout | trim == '192.168.2.240'

    - name: Gather service facts for the CA resolver
      ansible.builtin.service_facts:

    - name: Disable systemd-resolved on the CA guest
      when: "'systemd-resolved.service' in ansible_facts.services"
      ansible.builtin.systemd_service:
        name: systemd-resolved
        enabled: false
        state: stopped

    - name: Read the CA resolv.conf metadata
      ansible.builtin.stat:
        path: /etc/resolv.conf
        follow: false
      register: ca_resolv_conf

    - name: Remove a systemd-resolved resolv.conf symlink
      when: ca_resolv_conf.stat.islnk | default(false)
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent

    - name: Point the CA guest at the edge resolver
      ansible.builtin.copy:
        content: |
          # Managed by Ansible — ACME validation uses Technitium on the edge (ADR 40).
          nameserver {{ ca_dns_nameserver }}
          search {{ ca_dns_search }}
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
