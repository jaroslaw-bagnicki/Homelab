---
common_enable_avahi: true

# This node *is* the fleet resolver: the technitium role owns /etc/resolv.conf here
# (127.0.0.1, search `internal`) — the same resolver every other node is pinned to.
common_dns_server: ""

# LAN DNS + reverse proxy (ADR 40). TCP/80 stays closed — Caddy validates through
# TLS-ALPN-01 on 443, and Technitium serves DNS on 53/tcp+udp. Its admin API is
# loopback-only; use an SSH tunnel rather than opening 5380 to the LAN.
security_ufw_deny_inbound_tcp_80: true
security_ufw_allow_ssh_from: "192.168.2.0/24"
security_ufw_allow_tcp_from: "192.168.2.0/24"
security_ufw_allow_tcp_ports:
  - 53
  - 443
security_ufw_allow_udp_from: "192.168.2.0/24"
security_ufw_allow_udp_ports:
  - 53

# Public zone on the edge Caddy (ADR 24 (2026-11-14 amendment)) — the cloudflared tunnel on this box
# proxies these hostnames to the lab origin Caddy, which routes by Host inside
# the Docker network. Plain HTTP on loopback :80; TLS terminates at the CF edge.
caddy_public_sites:
  - name: cloud5.ovh
    upstream: "http://192.168.2.200:8080"
  - name: "*.cloud5.ovh"
    upstream: "http://192.168.2.200:8080"

# The lab Docker stack's names inside `.internal` (ADR 37). This proxy terminates TLS
# from the fleet CA and hands the whole hostname to the stack's own Caddy on :8080,
# which routes by service — so migrating the stack reads as one upstream IP here.
# Technitium's `*.internal` record already points them at this box; no DNS change.
caddy_workload_sites:
  - name: portainer.internal
    upstream: "http://192.168.2.200:8080"
  - name: zot.internal
    upstream: "http://192.168.2.200:8080"
  - name: hello.internal
    upstream: "http://192.168.2.200:8080"
  - name: homelab-oc.internal
    upstream: "http://192.168.2.200:8080"
  - name: prospera-oc.internal
    upstream: "http://192.168.2.200:8080"
  - name: test-oc.internal
    upstream: "http://192.168.2.200:8080"

netdata_role: child
netdata_stream_target: "192.168.2.201:19996"
netdata_stream_ssl: true
netdata_bind: "127.0.0.1"
netdata_storage: ram

# Fluent Bit collector (ADR 36) — journald only; a bounded memory ring buffer drops the oldest
# chunks and the cursor sits on tmpfs, so an unreachable store never writes to the eMMC (ADR 24).
fluentbit_buffer_type: memrb
fluentbit_buffer_limit: 16M
fluentbit_cursor_tmpfs: true

# Corosync QDevice arbitrator for the two-node Proxmox cluster (ADR 47) — TCP 5403
# from pve1/pve2 only.
corosync_qnetd_client_ips:
  - 192.168.2.201
  - 192.168.2.202
