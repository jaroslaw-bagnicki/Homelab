---
common_enable_avahi: true

# This node *is* the fleet resolver: the technitium role owns /etc/resolv.conf here
# (127.0.0.1, search `internal`) — the same resolver every other node is pinned to.
common_dns_server: ""

# LAN DNS + reverse proxy (ADR 40). TCP/80 stays closed — Caddy validates through
# TLS-ALPN-01 on 443, and Technitium serves DNS on 53/tcp+udp. Its admin API is
# loopback-only; use an SSH tunnel rather than opening 5380 to the LAN.
security_ufw_deny_inbound_tcp_80: true
security_ufw_allow_ssh_from: "192.168.2.0/24"
security_ufw_allow_tcp_from: "192.168.2.0/24"
security_ufw_allow_tcp_ports:
  - 53
  - 443
security_ufw_allow_udp_from: "192.168.2.0/24"
security_ufw_allow_udp_ports:
  - 53

netdata_role: child
netdata_stream_target: "192.168.2.201:19996"
netdata_stream_ssl: true
netdata_bind: "127.0.0.1"
netdata_storage: ram

# Fluent Bit collector (ADR 36) — journald only; a bounded memory ring buffer drops the oldest
# chunks and the cursor sits on tmpfs, so an unreachable store never writes to the eMMC (ADR 24).
fluentbit_buffer_type: memrb
fluentbit_buffer_limit: 16M
fluentbit_cursor_tmpfs: true
