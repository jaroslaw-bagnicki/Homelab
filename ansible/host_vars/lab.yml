---
arc_machine_name: lab
docker_users: []
common_enable_avahi: true
security_ufw_allow_ssh_from: "192.168.2.0/24"

# Docker workload stack migrated from cloudlab as-is (#44 intermediate step, runbook 47).
opencode_public_domain: cloud5.ovh
zot_public_domain: cloud5.ovh

# Origin Caddy published on the LAN IP for the edge Caddy's public zone (ADR 53);
# UFW below allows 8080 from the edge appliance (192.168.2.240) only.
docker_services_caddy_bind: "192.168.2.200:8080:8080"
security_ufw_allow_tcp_from: "192.168.2.240"
security_ufw_allow_tcp_ports:
  - 8080

opencode_instances:
  - name: homelab
    azure_sp: true
    gh_pat: true
  - name: prospera
  - name: test

netdata_role: child
netdata_stream_target: "192.168.2.201:19996"
netdata_stream_ssl: true
netdata_bind: "127.0.0.1"
netdata_storage: dbengine

# Fluent Bit collector (ADR 36) — journald plus the Docker json-file logs.
fluentbit_collect_docker: true
