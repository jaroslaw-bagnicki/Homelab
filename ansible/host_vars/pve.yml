---
common_enable_avahi: true

security_ufw_allow_ssh_from: "192.168.2.0/24"
security_ufw_allow_tcp_from: "192.168.2.0/24"
security_ufw_allow_tcp_ports:
  - 8006
  - 19996
  - 19999

netdata_role: parent
netdata_proxmox_host: true
# HTTPS-only dashboard (19999) and TLS-only streaming listener (19996), LAN-bound — no plain HTTP.
netdata_bind: "{{ ansible_host }}:19999=dashboard^SSL=force {{ ansible_host }}:19996=streaming^SSL=force"
netdata_tls: true
netdata_storage: dbengine
# Per-tier retention: raw 1s ≈21 d, 1m 30 d, 1h 365 d. Sizes come from measured growth
# (~145 MB/day tier 0, ~59 MB/day tier 1, ~5 MB/day tier 2 at 18.8k metrics, 2026-09-26);
# the sum of the caps is the DB ceiling (~7 GiB), on a filesystem the guests don't share.
netdata_retention_tiers:
  - { time: "21d", size: "3GiB" }     # tier 0 — 1s
  - { time: "30d", size: "2GiB" }     # tier 1 — 1m
  - { time: "365d", size: "2GiB" }    # tier 2 — 1h
# UPS telemetry — poll the NUT server (LXC 213 on this host); anonymous reads.
netdata_upsd_address: "192.168.2.213:3493"

nut_client_role: primary
nut_client_account: upsmon-host
nut_client_password_secret: nut-upsmon-primary-password
nut_client_hostsync: 30
nut_client_finaldelay: 30
