---
opencode_public_domain: cloud5.ovh
zot_public_domain: cloud5.ovh

docker_users: []

opencode_instances:
  - name: homelab
    azure_sp: true
    gh_pat: true
  - name: prospera
  - name: test

# cloudlab is outside SSH CA scope: no LAN route to ca.internal, so it keeps the
# fleet key and the pinned host key (ADR 41 amendment, issue #161).
ca_trust_ssh_enabled: false
security_ssh_certs_enabled: false
