---
# The Docker workload stack (opencode_public_domain, zot_public_domain,
# opencode_instances) moved to `lab` — see host_vars/lab.yml (runbook 47).
docker_users: []

# cloudlab is outside SSH CA scope: no LAN route to ca.internal, so it keeps the
# fleet key and the pinned host key (ADR 41 amendment, issue #161).
ca_trust_ssh_enabled: false
security_ssh_certs_enabled: false

# No LAN route to the fleet resolver — cloudlab keeps its own resolvers.
common_dns_server: ""
