# Ansible configuration (single root-level ansible.cfg). All paths are relative to the
# repo root, so run ansible-playbook / ansible-lint from here, e.g.
#   ansible-playbook ansible/playbooks/playbook.yml
# The VS Code redhat.ansible extension also runs from the workspace root, so this config
# resolves roles for it too.
[defaults]
inventory = ansible/inventory.ini
roles_path = ansible/roles/
host_key_checking = True
retry_files_enabled = True
log_path = ansible/ansible.log

[ssh_connection]
# Multiplexing stays on: a fleet run reuses one authenticated connection per host.
# ControlPersist is 5m because the identity loaders clear the sockets under ~/.ansible/cp
# before adding a key (scripts/Clear-HomelabSshControlMaster.ps1), so an identity change
# cannot ride a connection opened under the previous identity (ADR 41, #170).
ssh_args = -o ControlMaster=auto -o ControlPersist=5m
